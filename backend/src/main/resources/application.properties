spring.application.name=rental-hub
server.port=8081
spring.datasource.url=jdbc:h2:file:./data/rentalhub
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT secret can be overridden with the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:RentalHubJWTSecretKey_2026_Strong_Demo_ChangeMe_987654321}
